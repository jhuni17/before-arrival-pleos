pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        exclusiveContent {
            forRepository { maven { url 'https://nexus-playground.pleos.ai/repository/maven-releases/' } }
            filter {
                includeGroup 'ai.pleos.playground'
                includeModule 'ai.pleos.playground.security', 'universal-access'
            }
        }
    }
}

rootProject.name = 'BeforeArrival'
include ':app'
