plugins {
    id 'com.android.application'
}

android {
    namespace 'com.beforearrival.briefing'
    compileSdk 35
    useLibrary 'android.car', false

    defaultConfig {
        applicationId 'com.beforearrival.briefing'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1'
    }

    flavorDimensions 'route'
    productFlavors {
        sample { dimension 'route'; applicationIdSuffix '.sample' }
        pleos { dimension 'route' }
    }

    buildFeatures { buildConfig true }
    buildTypes {
        debug {
            def comparison = providers.gradleProperty('ttsComparison').getOrElse('off')
            if (!(comparison in ['off', 'baseline', 'candidate'])) throw new GradleException('ttsComparison must be off, baseline or candidate')
            buildConfigField 'String', 'TTS_COMPARISON', '"' + comparison + '"'
        }
        release { buildConfigField 'String', 'TTS_COMPARISON', '"off"' }
    }

    testOptions { unitTests.includeAndroidResources = true }
    sourceSets { main.assets.srcDirs += ['../../shared'] }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.16.1"
    pleosImplementation "ai.pleos.playground:NaviHelper:3.0.5"
    pleosImplementation "ai.pleos.playground:TextToSpeech:3.3.1"
}

// Use the same session proxy/trust configuration for the Robolectric test JVM.
tasks.withType(Test).configureEach {
    ['https.proxyHost', 'https.proxyPort', 'http.proxyHost', 'http.proxyPort',
     'javax.net.ssl.trustStore'].each { key ->
        if (System.getProperty(key)) systemProperty key, System.getProperty(key)
    }
    systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
}
